name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    name: Build et tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Rendre le wrapper Maven exécutable
        run: chmod +x mvnw

      - name: Compiler et lancer tous les tests
        run: ./mvnw -B verify